<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LibrAgent Bridge</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        min-width: 260px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #state {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      #state.ok {
        color: #047857;
      }
      #detail {
        font-size: 12px;
        color: #555;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      button {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      a {
        font-size: 12px;
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <h1>LibrAgent Browser Bridge</h1>
    <div id="state">Checking…</div>
    <p id="detail"></p>
    <button id="reconnect" type="button">Reconnect now</button>
    <p style="margin-top: 12px">
      <a href="options.html" id="optionsLink">Advanced settings</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
