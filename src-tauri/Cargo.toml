[package]
name = "libragent"
version = "0.7.13"
description = "A desktop app for AI agents with built-in tools"
authors = ["fritzprix"]
license = "MIT"
repository = "https://github.com/fritzprix/libr-agent.git"
edition = "2021"
keywords = ["ai", "agent", "multi-agent", "orchestration", "mcp", "model-context-protocol", "react", "desktop", "shareable-config"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_mcp_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false
# NOTE: lib unit tests are disabled due to cdylib linkage requirements.
# All tests live in tests/ and are run with: cargo test --tests

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.51", features = ["full"] }
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
tokio-util = "0.7"
futures = "0.3"
rmcp = { version = "0.8.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-sse-client-reqwest", "auth"] }
oauth2 = "4.4"
keyring = "3.0"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
log = "0.4.29"
fern = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
path-clean = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.16"
walkdir = "2.4"
glob = "0.3"
ignore = "0.4"
sha2 = "0.10"
html-escape = "0.2"
html2md = "0.2"           # HTML to Markdown conversion
tiktoken-rs = "0.11"       # OpenAI tokenizer for accurate token-based pagination
warp = "0.3"
dashmap = "5.5"
regex = "1"
cuid2 = "0.1.4"
dirs = "5.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
handlebars = "6.4"
ammonia = "4.0"
jsonschema = "0.33"

# Windows-only: decode process output captured from stdio pipes using the system ANSI code page
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

# File parsing dependencies
docx-rs = "0.4"           # DOCX parsing
calamine = { version = "0.34", features = ["dates"] }  # XLSX parsing
lopdf = "0.31"            # PDF parsing
pdf-extract = "0.7"       # Better PDF text extraction
# tantivy = "0.21"       # BM25 text search - temporarily disabled due to zstd conflicts
bm25 = { version = "2.3.2", features = ["parallelism"] }  # BM25 search with parallel indexing
base64 = "0.22.1"
once_cell = "1.21"        # Lazy static initialization
bincode = "1.3"           # Binary serialization for index persistence
dotenvy = "0.15"
url = "2"                 # URL parsing for file:// URL handling

# SeaORM dependencies for database ORM
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
migration = { path = "migration" }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tauri-plugin-mcp-bridge = "0.11.0"
sqlite-vec = "0.1.9"
fastembed = "5.13.0"

[dev-dependencies]
# test-util enables tokio::time::pause() / advance() for time-controlled async tests.
tokio = { version = "1.51", features = ["test-util"] }

[profile.ci-test]
inherits = "test"
debug = 0
incremental = false

[workspace]
members = ["migration"]
