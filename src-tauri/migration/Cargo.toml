[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
log = "0.4"
serde_json = "1.0"
cuid2 = "0.1"

[dependencies.sea-orm-migration]
version = "2.0"
features = ["sqlx-sqlite", "runtime-tokio-rustls"]

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
