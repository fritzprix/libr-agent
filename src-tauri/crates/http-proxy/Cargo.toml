[package]
name = "http-proxy"
version = "0.1.0"
edition = "2021"
description = "Windows PAC/system proxy resolution for reqwest (env precedence, cached WinHTTP)"
publish = false

[dependencies]
dashmap = "6.2"
log = "0.4.30"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "=1.52.2", features = ["rt", "sync"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
tokio = { version = "=1.52.2", features = ["macros", "rt-multi-thread"] }