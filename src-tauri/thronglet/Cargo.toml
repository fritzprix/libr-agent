[package]
name = "thronglet"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
thiserror = "1.0"
futures = "0.3"
