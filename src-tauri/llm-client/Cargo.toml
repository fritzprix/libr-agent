[package]
name = "llm-client"
version = "0.1.0"
edition = "2021"
description = "Tauri-free LLM client: the provider trait and the OpenAI-compatible providers."

[lib]
name = "llm_client"
path = "src/lib.rs"

[features]
# TypeScript bindings for shared types; the app enables it for its binding check.
ts = ["dep:ts-rs"]

[dependencies]
futures = "0.3"
log = "0.4.30"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["time"] }
ts-rs = { version = "12.0.1", optional = true }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
warp = "0.3"
