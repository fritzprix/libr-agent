<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibrAgent</title>
    <script>
      // Early boot diagnostics for Windows release white screen debugging
      console.log('[BOOT] LibrAgent initializing at', new Date().toISOString());
      window.__BOOT_START = Date.now();

      // Anti-FOUC: match next-themes (attribute=class, defaultTheme=dark)
      // before React mounts so WebView2 does not flash a white/light surface.
      // Use a removable <style> (not inline element styles) so ThemeToggle can
      // flip .dark without leaving a sticky backgroundColor on html/body.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'system') {
            isDark = window.matchMedia(
              '(prefers-color-scheme: dark)',
            ).matches;
          } else {
            // null / 'dark' / unknown → defaultTheme dark
            isDark = true;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var style = document.createElement('style');
          style.id = 'anti-fouc';
          style.textContent =
            'html,body{margin:0;background-color:#ffffff}' +
            'html.dark,html.dark body{background-color:#1a1a1a}';
          document.head.appendChild(style);
          window.addEventListener('load', function () {
            var el = document.getElementById('anti-fouc');
            if (el) el.remove();
          });
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();

      // Capture all errors during bootstrap phase
      window.addEventListener('error', function (e) {
        console.error('[BOOT-ERROR]', {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error ? e.error.stack : 'No stack trace',
        });
      });

      // Capture unhandled promise rejections
      window.addEventListener('unhandledrejection', function (e) {
        console.error('[BOOT-PROMISE-REJECT]', {
          reason: e.reason,
          promise: e.promise,
        });
      });

      // Log when main script loads
      console.log(
        '[BOOT] Event handlers registered, awaiting main script load',
      );
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
