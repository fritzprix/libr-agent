name: Build session image and check its size
description: >
  Builds docker/ for all platforms into the job's local registry service (localhost:5000)
  and fails when a platform's compressed size is above the limit.
inputs:
  local-image:
    description: Local registry reference to build into.
    required: true
  platforms:
    description: Build platforms.
    required: true
  size-limit-mb:
    description: Compressed size limit per platform, in MB.
    required: true
runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: network=host

    - name: Build into the local registry
      uses: docker/build-push-action@v7
      with:
        context: docker
        platforms: ${{ inputs.platforms }}
        push: true
        provenance: false
        tags: ${{ inputs.local-image }}
        cache-from: type=gha,scope=session-image
        cache-to: type=gha,mode=max,scope=session-image

    - name: Report compressed size
      shell: bash
      env:
        LOCAL_IMAGE: ${{ inputs.local-image }}
        SIZE_LIMIT_MB: ${{ inputs.size-limit-mb }}
      run: |
        set -euo pipefail
        REPOSITORY="${LOCAL_IMAGE#localhost:5000/}"
        REGISTRY="http://localhost:5000/v2/${REPOSITORY%%:*}/manifests"
        ACCEPT_INDEX='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
        ACCEPT_MANIFEST='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        LIMIT_BYTES=$((SIZE_LIMIT_MB * 1000 * 1000))

        {
          echo "### Session image compressed size"
          echo
          echo "| Platform | Size (MB) | Limit (MB) |"
          echo "|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"

        FAILED=0
        while read -r PLATFORM DIGEST; do
          BYTES=$(curl -fsS -H "Accept: $ACCEPT_MANIFEST" "$REGISTRY/$DIGEST" \
            | jq '[.config.size] + [.layers[].size] | add')
          MB=$(awk "BEGIN { printf \"%.1f\", $BYTES / 1000000 }")
          echo "$PLATFORM: $MB MB"
          echo "| $PLATFORM | $MB | $SIZE_LIMIT_MB |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::$PLATFORM image is $MB MB, above the $SIZE_LIMIT_MB MB limit"
            FAILED=1
          fi
        done < <(curl -fsS -H "Accept: $ACCEPT_INDEX" "$REGISTRY/${REPOSITORY##*:}" \
          | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture) \(.digest)"')

        exit "$FAILED"
