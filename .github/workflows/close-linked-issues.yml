name: Close linked issues on merge

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Strip inline/fenced code so stack notes like `Fixes #1234` are ignored.
            const text = [
              context.payload.pull_request.title ?? '',
              context.payload.pull_request.body ?? '',
            ]
              .join('\n')
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`]*`/g, '');

            const regex =
              /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s+#(\d+)/gi;
            const issueNumbers = new Set();

            for (const match of text.matchAll(regex)) {
              issueNumbers.add(Number.parseInt(match[1], 10));
            }

            for (const issue_number of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                if (issue.state === 'closed') {
                  core.info(`Issue #${issue_number} already closed; skipping`);
                  continue;
                }
                core.info(`Closing issue #${issue_number}`);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              } catch (error) {
                const status = error?.status ?? error?.response?.status;
                if (status === 422) {
                  core.warning(
                    `Skip #${issue_number}: already closed or not closable (${error.message})`,
                  );
                  continue;
                }
                throw error;
              }
            }
