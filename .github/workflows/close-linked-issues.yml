name: Close linked issues on merge

# GitHub only honors closing keywords for PRs merged into the default branch.
# Most PRs here merge into dev/*, so close their `Fixes #N` issues explicitly.
#
# pull_request_target runs this file from the default branch and never checks
# out PR code; the PR title/body are read as data only, so fork PRs are safe.
on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Strip inline/fenced code so stack notes like `Fixes #1234` are ignored.
            const text = [pr.title ?? '', pr.body ?? '']
              .join('\n')
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`]*`/g, '');

            const keyword =
              '\\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\\s*:?\\s+';
            // `#N` only (not `owner/repo#N`), or a full issue URL.
            const regex = new RegExp(
              `${keyword}(?:(?<![\\w/])#(\\d+)\\b|https://github\\.com/([\\w.-]+)/([\\w.-]+)/issues/(\\d+)\\b)`,
              'gi',
            );

            const issueNumbers = new Set();
            for (const match of text.matchAll(regex)) {
              if (match[1]) {
                issueNumbers.add(Number.parseInt(match[1], 10));
                continue;
              }
              const sameRepo =
                match[2].toLowerCase() === owner.toLowerCase() &&
                match[3].toLowerCase() === repo.toLowerCase();
              if (sameRepo) {
                issueNumbers.add(Number.parseInt(match[4], 10));
              } else {
                core.info(`Skip cross-repo reference ${match[2]}/${match[3]}#${match[4]}`);
              }
            }

            for (const issue_number of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number,
                });
                if (issue.pull_request) {
                  core.info(`#${issue_number} is a pull request; skipping`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`Issue #${issue_number} already closed; skipping`);
                  continue;
                }
                core.info(`Closing issue #${issue_number}`);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Closed by #${pr.number} (merged into \`${pr.base.ref}\`).`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              } catch (error) {
                // Never fail the merge pipeline over one issue.
                core.warning(`Could not close #${issue_number}: ${error.message}`);
              }
            }
