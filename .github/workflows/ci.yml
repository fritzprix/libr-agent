name: 🚀 LibrAgent CI/CD

on:
  push:
    branches: [main, master, dev/0.6.x]
  pull_request:
    branches: [main, master, dev/0.6.x]

jobs:
  test:
    name: 🧪 Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: � Lint check
        run: pnpm lint

      - name: �🔧 Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: 🧪 Run tests (if available)
        run: pnpm test || echo "No tests defined"

      - name: 🔍 Check TypeScript
        run: pnpm tsc --noEmit

      - name: 🦀 Check Rust
        run: cd src-tauri && cargo check

      - name: 🧪 Run Rust integration tests
        run: cd src-tauri && cargo test --tests -- --test-threads=1

      # Code Quality Checks (PR only)
      - name: 🦀 Install Clippy
        run: rustup component add clippy
      - name: 🔍 Rust Clippy (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: 🦀 Install rustfmt
        run: rustup component add rustfmt
      - name: 🎨 Rust Format Check (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo fmt --check

      # Security Checks (PR only)
      - name: 🔒 npm audit (PR)
        if: github.event_name == 'pull_request'
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: 🔒 Cargo audit (PR)
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-audit
          cd src-tauri && cargo audit
        continue-on-error: true

  build:
    name: 🔨 Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔧 Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: 🏗️ Build Tauri app
        run: pnpm tauri build --config '{"bundle": {"createUpdaterArtifacts": false}}'
        env:
          # Use dummy value for CI if needed, but --config override is preferred
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libragent-build-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
          retention-days: 7
