name: LibrAgent CI/CD

on:
  push:
    branches: [main, master, 'dev/*']
  pull_request:
    branches: [main, master, 'dev/*']

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Check Cargo.lock version sync
        run: pnpm rust:lock:check

      - name: Check obsolete builtin tool names
        run: pnpm tool-names:check

      - name: Validate bundled skills
        if: matrix.os == 'ubuntu-latest'
        run: pnpm skills:audit

      - name: Check skills mirror drift
        if: matrix.os == 'ubuntu-latest'
        run: pnpm skills:mirror:check

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libegl-dev \
            libgbm-dev \
            libxkbcommon-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Run frontend tests
        run: pnpm test:run

      - name: Run smoke matrix guard tests
        run: node --test .agents/skills/libr-e2e-verify/scripts/smoke_matrix.test.cjs

      - name: Check TypeScript
        run: pnpm tsc --noEmit

      - name: Check bundle budget (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build && pnpm perf:bundle

      - name: Check Rust
        # `ort-sys` (transitive via fastembed) downloads prebuilt ONNX Runtime
        # binaries at build time; a torn CDN download ("Peer disconnected")
        # must not fail the job on its first occurrence (#2803). Retry once
        # when the build script reports that failure; a successful attempt
        # caches the binaries on disk for every later build step of this job.
        shell: bash
        run: |
          cd src-tauri
          status=0
          cargo check 2>&1 | tee "$RUNNER_TEMP/cargo-check.log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -qiE 'ort-sys.*(download|extract|prebuilt)' "$RUNNER_TEMP/cargo-check.log"; then
            echo "::warning::ort-sys prebuilt ONNX Runtime download failed; retrying cargo check once"
            sleep 15
            cargo check
          else
            exit "$status"
          fi

      - name: Fix macOS SDKROOT for Rust linker
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Run Rust integration tests
        run: pnpm rust:test

      - name: Run Rust integration tests (edit-file build)
        run: pnpm rust:test:edit-file

      # Code Quality Checks (PR only)
      - name: Install Clippy
        run: rustup component add clippy
      - name: Rust Clippy (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Rust Format Check (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo fmt --check

      # Security Checks (PR only)
      - name: npm audit (PR)
        if: github.event_name == 'pull_request'
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Cargo audit (PR)
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-audit
          cd src-tauri && cargo audit
        continue-on-error: true

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libegl-dev \
            libgbm-dev \
            libxkbcommon-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Build Tauri app
        # macOS GitHub runners flake in bundle_dmg.sh (hdiutil detach timeout).
        # PR CI still builds LibrAgent.app; release/nightly keep producing DMGs.
        run: |
          extra_args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra_args+=(--bundles app)
          fi
          pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' "${extra_args[@]}"
        shell: bash
        env:
          # Use dummy value for CI if needed, but --config override is preferred
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libragent-build-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
          retention-days: 7

  session-e2e:
    name: Session API E2E (Linux isolated, debug)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Skip when E2E secrets are not configured
        id: gate
        env:
          GATE_ASSISTANT_ID: ${{ secrets.SESSION_E2E_ASSISTANT_ID }}
          GATE_SEED_DB: ${{ secrets.SESSION_E2E_SEED_DB }}
          GATE_SEED_DB_B64: ${{ secrets.SESSION_E2E_SEED_DB_B64 }}
        run: |
          enabled=false
          if [ -n "$GATE_ASSISTANT_ID" ] && { [ -n "$GATE_SEED_DB" ] || [ -n "$GATE_SEED_DB_B64" ]; }; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Notice
        if: steps.gate.outputs.enabled != 'true'
        run: echo "::notice::Skipping Session API E2E — set SESSION_E2E_ASSISTANT_ID + SESSION_E2E_SEED_DB (or _B64) to enable this job."

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.gate.outputs.enabled == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Tauri dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libegl-dev \
            libgbm-dev \
            libxkbcommon-dev \
            xvfb

      - name: Build frontend
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm build

      - name: Build debug app binary
        if: steps.gate.outputs.enabled == 'true'
        # The E2E control plane only exists in debug builds, so the matrix
        # requires the debug binary; the release binary must keep answering
        # 404 for /api/e2e-control/* (2672 E-2, asserted in Rust tests).
        run: node scripts/run-rust-command.cjs build

      - name: Seed the disposable bench instance
        if: steps.gate.outputs.enabled == 'true'
        env:
          SESSION_E2E_ASSISTANT_ID: ${{ secrets.SESSION_E2E_ASSISTANT_ID }}
          SESSION_E2E_SEED_DB: ${{ secrets.SESSION_E2E_SEED_DB }}
          SESSION_E2E_SEED_DB_B64: ${{ secrets.SESSION_E2E_SEED_DB_B64 }}
        run: |
          if [ -n "${SESSION_E2E_SEED_DB:-}" ]; then
            source_db="$SESSION_E2E_SEED_DB"
          else
            source_db="$RUNNER_TEMP/seed.db"
            printf '%s' "$SESSION_E2E_SEED_DB_B64" | base64 -d > "$source_db"
          fi
          python3 -m benchmarks.harbor.isolated_instance seed \
            --assistant-id "$SESSION_E2E_ASSISTANT_ID" \
            --source-db "$source_db"

      - name: Run the Session API E2E matrix
        if: steps.gate.outputs.enabled == 'true'
        env:
          LIBRAGENT_ASSISTANT_ID: ${{ secrets.SESSION_E2E_ASSISTANT_ID }}
          LIBRAGENT_MODEL: ${{ secrets.SESSION_E2E_MODEL }}
          SESSION_E2E_ASSISTANT_ID: ${{ secrets.SESSION_E2E_ASSISTANT_ID }}
          SESSION_E2E_SEED_DB: ${{ secrets.SESSION_E2E_SEED_DB }}
          SESSION_E2E_SEED_DB_B64: ${{ secrets.SESSION_E2E_SEED_DB_B64 }}
          SESSION_E2E_MODEL: ${{ secrets.SESSION_E2E_MODEL }}
          LIBRAGENT_SESSION_API_KEY: ${{ secrets.LIBRAGENT_SESSION_API_KEY }}
          # Only the synthetic fixture value, never a production credential.
          LIBRAGENT_E2E_SYNTHETIC_SECRET: ${{ secrets.LIBRAGENT_E2E_SYNTHETIC_SECRET }}
        # --isolated + --debug-app-bin is the only fully unattended
        # combination: it launches the debug binary under a disposable
        # profile and refuses the primary one.
        run: |
          xvfb-run -a --auto-servernum \
            pnpm bench:session-e2e

      - name: Upload bench results
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: session-e2e-results
          path: |
            .libragent/work/harbor/
            .libragent/work/bench-instance/logs/
          if-no-files-found: ignore
          retention-days: 7
