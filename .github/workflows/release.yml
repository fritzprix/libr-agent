name: 📦 Release LibrAgent
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1). If omitted when manually dispatching, the pushed tag (if any) will be used.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    environment: copilot
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract changelog for release notes
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Extract ONLY this version section from CHANGELOG.md (strict mode)
          CHANGELOG_CONTENT=$(awk -v ver="$VERSION_NUM" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md)

          if ! printf '%s\n' "$CHANGELOG_CONTENT" | grep -q '[^[:space:]]'; then
            echo "❌ Missing changelog section for [$VERSION_NUM] in CHANGELOG.md"
            echo "Please add a section like: ## [$VERSION_NUM] - YYYY-MM-DD"
            exit 1
          fi

          echo "✅ Extracted changelog for [$VERSION_NUM]"

          # Escape content for GitHub Actions output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo ""
            echo "Without this key, tauri-action will skip uploading latest.json, and"
            echo "the in-app updater will fail with a non-200 response from the endpoint."
            echo ""
            echo "To fix:"
            echo "  1. Generate the key: pnpm tauri signer generate -w ~/.tauri/libragent.key"
            echo "  2. Go to: GitHub repo → Settings → Environments → copilot → Secrets"
            echo "  3. Add TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/libragent.key)"
            echo "  4. Optionally add TAURI_SIGNING_PRIVATE_KEY_PASSWORD if you set one"
            echo ""
            echo "The matching public key must also be set in src-tauri/tauri.conf.json → plugins.updater.pubkey"
            exit 1
          fi
          echo "✅ Updater signing key is configured."

          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              echo "❌ macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, or APPLE_SIGNING_IDENTITY is not set."
              echo "These are required for code signing on macOS."
              exit 1
            fi
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "⚠️ macOS: APPLE_ID, APPLE_PASSWORD, or APPLE_TEAM_ID is not set."
              echo "Notarization will be skipped, and the app will show a security warning to users."
            else
              echo "✅ macOS: Signing and notarization credentials are configured."
            fi
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OTA signing keys — generate once with: pnpm tauri signer generate -w ~/.tauri/libragent.key
          # Then add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD to GitHub Secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing & notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseName: LibrAgent ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.content }}

            ## 📦 Installation

            ### Windows
            Download and run `LibrAgent_x64_en-US.msi`

            ### macOS
            Download `LibrAgent_x64.dmg` (or silicon version if available), open it and drag the app to your Applications folder.
            If you use the `.app.tar.gz`, extract it first.

            ### Linux (Debian/Ubuntu)
            After downloading the `.deb` package:
            ```bash
            sudo apt install -f
            ```
            Or install dependencies manually:
            ```bash
            sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-gtk3 gstreamer1.0-pulseaudio
            sudo dpkg -i LibrAgent_*_amd64.deb
            ```

            ### Linux (AppImage)
            Download `.AppImage`, make executable and run:
            ```bash
            chmod +x LibrAgent_*.AppImage
            ./LibrAgent_*.AppImage
            ```

            ## 🔧 Requirements
            - Windows 10+ / macOS 10.15+ / Linux (modern distribution)
            - 4GB RAM minimum, 8GB recommended

            See the assets below to download for your platform.
          releaseDraft: false
          prerelease: false
