name: 📦 Release LibrAgent
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1). If omitted when manually dispatching, the pushed tag (if any) will be used.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync node version and setup cache
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract changelog for release notes
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          
          # Extract changelog content for this version
          CHANGELOG_CONTENT=$(sed -n "/^## \[\(Unreleased\|$VERSION_NUM\)\]/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +3)
          
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "No changelog found for version $VERSION_NUM, using default content"
            CHANGELOG_CONTENT="See CHANGELOG.md for details."
          fi
          
          # Escape content for GitHub Actions output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseName: LibrAgent ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.content }}

            ## 📦 Installation

            ### Windows
            Download and run `LibrAgent_x64_en-US.msi`

            ### macOS
            Download `LibrAgent.app.tar.gz`, extract and copy to Applications folder

            ### Linux (Debian/Ubuntu)
            After downloading the `.deb` package:
            ```bash
            sudo apt install -f
            ```
            Or install dependencies manually:
            ```bash
            sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-gtk3 gstreamer1.0-pulseaudio
            sudo dpkg -i LibrAgent_*_amd64.deb
            ```

            ### Linux (AppImage)
            Download `.AppImage`, make executable and run:
            ```bash
            chmod +x LibrAgent_*.AppImage
            ./LibrAgent_*.AppImage
            ```

            ## 🔧 Requirements
            - Windows 10+ / macOS 10.15+ / Linux (modern distribution)
            - 4GB RAM minimum, 8GB recommended

            See the assets below to download for your platform.
          releaseDraft: false
          prerelease: false
