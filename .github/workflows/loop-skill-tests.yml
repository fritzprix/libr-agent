name: Loop skill tests

# Like LibrAgent CI/CD, PR runs start only when the gatekeeper adds
# gatekeeper:review-clean. Other events produce all-skipped runs. The paths
# filter also applies to the labeled event.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.agents/skills/loop-shared/**'
      - '.agents/skills/worker-loop/**'
      - '.agents/skills/gatekeeper-loop/**'
      - '.agents/skills/producer-loop/**'
      - '.github/workflows/loop-skill-tests.yml'

permissions:
  contents: read

jobs:
  test:
    if: github.event.action == 'labeled' && github.event.label.name == 'gatekeeper:review-clean'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run tests
        # PowerShell, the Windows default, exits with the last command's code,
        # so a failure in the first suite would pass. bash stops at the first one.
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s .agents/skills/loop-shared/scripts -p "test_*.py"
          python -m unittest discover -s .agents/skills/worker-loop/scripts -p "test_*.py"
          python -m unittest discover -s .agents/skills/gatekeeper-loop/scripts -p "test_*.py"
          python -m unittest discover -s .agents/skills/producer-loop/scripts -p "test_*.py"
