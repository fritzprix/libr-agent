name: Loop skill tests

on:
  pull_request:
    paths:
      - '.agents/skills/worker-loop/**'
      - '.agents/skills/producer-loop/**'
      - '.github/workflows/loop-skill-tests.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s .agents/skills/worker-loop/scripts -p "test_*.py"
          python -m unittest discover -s .agents/skills/producer-loop/scripts -p "test_*.py"
