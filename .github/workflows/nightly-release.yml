name: 🌙 Nightly Release
on:
  schedule:
    - cron: '0 15 * * *' # 매일 자정(KST) 실행
  workflow_dispatch: # 수동 트리거 지원

jobs:
  nightly-release:
    permissions:
      contents: write
    environment: copilot
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest dev branch
        shell: bash
        run: |
          # 스케줄 트리거 시 default 브랜치(main)에서 실행되므로, 최신 dev 브랜치를 찾아 체크아웃합니다.
          LATEST_DEV=$(git for-each-ref --sort=-version:refname --format='%(refname:lstrip=3)' refs/remotes/origin/dev/ | head -n 1)
          if [ -n "$LATEST_DEV" ]; then
            echo "Switching to $LATEST_DEV"
            git checkout "$LATEST_DEV"
          fi

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Sync node version and setup cache
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Nightly Tag
        id: tag
        shell: bash
        run: |
          DATE_STR=$(date +'%Y%m%d')
          echo "tag=nightly-$DATE_STR" >> $GITHUB_OUTPUT

      - name: Validate signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY secret is not set. Updater will fail."
            exit 1
          fi
          echo "✅ Updater signing key is configured."

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: '🌙 LibrAgent Nightly (${{ steps.tag.outputs.tag }})'
          releaseBody: |
            ## 🌙 Nightly Build
            This is an automated nightly build generated from the latest `dev` branch.
            **Warning:** Nightly builds may contain unstable features, unfinished changes, and bugs. Use them for testing purposes only.

            ### 📦 Installation
            See the assets below to download for your platform.
          releaseDraft: false
          prerelease: true
