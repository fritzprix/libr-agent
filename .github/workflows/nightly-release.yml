name: 🌙 Nightly Release
on:
  schedule:
    - cron: '0 15 * * *' # 매일 자정(KST) 실행
  workflow_dispatch: # 수동 트리거 지원

jobs:
  # The release job below builds the latest dev branch, so the relay must come from it too.
  latest-dev:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.dev.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the latest dev branch
        id: dev
        shell: bash
        run: |
          LATEST_DEV=$(git for-each-ref --sort=-version:refname --format='%(refname:lstrip=3)' refs/remotes/origin/dev/ | head -n 1)
          echo "ref=$LATEST_DEV" >> "$GITHUB_OUTPUT"

  relay:
    needs: latest-dev
    uses: ./.github/workflows/session-relay.yml
    with:
      ref: ${{ needs.latest-dev.outputs.ref }}

  nightly-release:
    needs: [latest-dev, relay]
    permissions:
      contents: write
    environment: copilot
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest dev branch
        shell: bash
        env:
          # The same ref the relay was built from; never recomputed here, so the relay and the
          # app cannot come from different commits. Passed through env, not interpolated into
          # the script, and checked before use.
          LATEST_DEV: ${{ needs.latest-dev.outputs.ref }}
        run: |
          if [ -n "$LATEST_DEV" ]; then
            if ! printf '%s' "$LATEST_DEV" | grep -Eq '^dev/[0-9A-Za-z._-]+$'; then
              echo "Unexpected dev branch name: $LATEST_DEV" >&2
              exit 1
            fi
            echo "Switching to $LATEST_DEV"
            git checkout "$LATEST_DEV"
          fi

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 15
        run: bash .github/scripts/install-ubuntu-22-release-deps.sh

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Sync node version and setup cache
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Nightly Tag
        id: tag
        shell: bash
        run: |
          DATE_STR=$(date +'%Y%m%d')
          echo "tag=nightly-$DATE_STR" >> $GITHUB_OUTPUT

      - name: Validate signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY secret is not set. Updater will fail."
            exit 1
          fi
          echo "✅ Updater signing key is configured."

      - name: Download session-relay binaries
        uses: actions/download-artifact@v7
        with:
          pattern: session-relay-*
          merge-multiple: true
          path: relay

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Embedded into the app by build.rs (build_support/session_relay.rs).
          LIBRAGENT_RELAY_DIR: ${{ github.workspace }}/relay
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          # Ubuntu 22.04: shared ORT + bundle libonnxruntime for AppImageHub (glibc 2.35).
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--config src-tauri/tauri.appimage-ort.conf.json' || '' }}
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: '🌙 LibrAgent Nightly (${{ steps.tag.outputs.tag }})'
          releaseBody: |
            ## 🌙 Nightly Build
            This is an automated nightly build generated from the latest `dev` branch.
            **Warning:** Nightly builds may contain unstable features, unfinished changes, and bugs. Use them for testing purposes only.

            ### 📦 Installation
            See the assets below to download for your platform.
          releaseDraft: false
          prerelease: true

  cleanup-old-nightlies:
    needs: nightly-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep only the latest 2 nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIGHTLY_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName')
          COUNT=0
          for TAG in $NIGHTLY_TAGS; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt 2 ]; then
              echo "Deleting old nightly release: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
            fi
          done
