schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-win-shell-terminate-p6"
description = "2565 P-6 (Windows process half): a child session's persistent PowerShell shell is alive while the child waits on ui__askUser and is force-killed when the harness terminates the child; it never respawns"
keywords = ["libragent", "session-e2e", "askuser", "terminate", "persistent-shell", "windows"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "P-6", "platform-windows", "persistent-shell"]

[metadata.libragent_session_e2e]
matrix_id = "P-6"
requires_host_os = "windows"
auto_answer_interactive = true
approve_standard_tools = true
resolve_child_interactions = true
terminate_child_on_prompt = true
check_persistent_shell_after_terminate = true

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
