schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-mcp-keychain-unavailable-restart"
description = "2672 M-5: when OS keychain is unavailable, MCP server secret is stored in encrypted_secrets fallback and survives an in-place instance restart without leaking literals"
keywords = ["libragent", "session-e2e", "mcp", "keychain", "fallback", "restart"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "M-5", "keychain", "fallback", "restart"]

[metadata.libragent_session_e2e]
matrix_id = "2672-M-5"
mock_keychain_mode = "unavailable"
auto_answer_interactive = true
approve_standard_tools = true
reject_hard_approvals = false
restart_after_completion = true
post_restart_http_probes = [
  { name = "health", path = "/health" },
]
post_restart_sql_probes = [
  { name = "mcp_server", query = "SELECT name, config, secret_names, CASE WHEN encrypted_secrets IS NOT NULL AND length(encrypted_secrets) > 0 THEN 1 ELSE 0 END AS has_encrypted FROM mcp_servers WHERE name = 'e2e-m5-fallback'" },
]

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
