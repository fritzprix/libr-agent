schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-skill-storeas-flows"
description = "2565 S-1, S-2, S-5, S-6 & 2685 E-3: generic storeAs secret collection mechanism with the skills' variable names (TELEGRAM_API_HASH, X_PASSWORD, LIBRAGENT_EMAIL_PASSWORD, LIBRAGENT_GOOGLE_CLIENT_SECRET) delivers values to the persistent shell env without leaking literals in trajectory or logs; the skills' own instructions are not exercised"
keywords = ["libragent", "session-e2e", "storeas", "skills", "secret"]

[metadata]
difficulty = "easy"
category = "session-api-e2e"
tags = ["matrix", "S-1", "S-2", "S-5", "S-6", "E-3", "storeas", "skills"]

[metadata.libragent_session_e2e]
matrix_id = "S-1"
auto_answer_interactive = true
approve_standard_tools = true
distinct_secret_per_prompt = true

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
