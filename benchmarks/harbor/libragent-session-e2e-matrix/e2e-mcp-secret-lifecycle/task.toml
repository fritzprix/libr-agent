schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-mcp-secret-lifecycle"
description = "2565 M-2, M-6, M-8, X-6: register HTTP MCP server with URL {{secret:NAME}} template, re-enter secret via tool__updateServer(reenterSecrets), confirm MCP secret store is separate from shell env, and confirm no secret literal leaks into trajectory or logs"
keywords = ["libragent", "session-e2e", "mcp", "secret", "storeas"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "M-2", "M-6", "M-8", "X-6", "mcp", "secret"]

[metadata.libragent_session_e2e]
matrix_id = "M-2"
auto_answer_interactive = true
approve_standard_tools = true
reject_hard_approvals = false
distinct_secret_per_prompt = true

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
