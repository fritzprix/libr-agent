schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-mcp-secret-template"
description = "registering an MCP server that needs a key stores the secret as a {{secret:NAME}} template and never asks for the value in chat"
keywords = ["libragent", "session-e2e", "mcp", "secret", "template"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "K-3", "mcp", "secrets"]

[metadata.libragent_session_e2e]
matrix_id = "K-3"
auto_answer_interactive = true
approve_standard_tools = true
synthetic_secret_env = "LIBRAGENT_E2E_SYNTHETIC_SECRET"

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
