schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-storeas-masked"
description = "storeAs secret answer flows into the shell env without leaking the value into logs"
keywords = ["libragent", "session-e2e", "storeas", "secret"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "B-12", "storeas", "masking"]

[metadata.libragent_session_e2e]
matrix_id = "B-12"
auto_answer_interactive = true
approve_standard_tools = true
synthetic_secret_env = "LIBRAGENT_E2E_SYNTHETIC_SECRET"

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
