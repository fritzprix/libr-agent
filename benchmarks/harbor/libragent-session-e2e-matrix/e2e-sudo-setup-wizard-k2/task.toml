schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-sudo-setup-wizard-k2"
description = "2672 K-2: setup-wizard root step asks once for SUDO_PASSWORD via storeAs, uses plain sudo, and never invokes sudo -n, sudo -S, su, or pkexec"
keywords = ["libragent", "session-e2e", "sudo", "setup-wizard", "privileged"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "K-2", "sudo", "setup-wizard", "privileged"]

[metadata.libragent_session_e2e]
matrix_id = "K-2"
# The privileged fakes live in this task image; host mode would run
# sudo against the host instead. The adapter fails fast on a mismatch (G1.2).
requires_workspace_mode = "managed"
auto_answer_interactive = true
approve_standard_tools = true
answer_value = "e2e-sudo-fixture"

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
