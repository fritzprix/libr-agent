schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-tool-approval-normal"
description = "Tool approval opens in normal mode and is answered through the E2E control plane"
keywords = ["libragent", "session-e2e", "approval"]

[metadata]
difficulty = "easy"
category = "session-api-e2e"
tags = ["matrix", "2672-R-2", "approval", "normal-mode"]

[metadata.libragent_session_e2e]
