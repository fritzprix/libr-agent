schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-askuser-restart-orphan"
description = "2565 P-8 & 2672 A-4: restarting the isolated app while ui__askUser waits closes the orphaned tool call with 'User did not answer (app restarted).'"
keywords = ["libragent", "session-e2e", "askuser", "restart", "recovery"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "P-8", "A-4", "askuser", "restart"]

[metadata.libragent_session_e2e]
matrix_id = "P-8"
restart_while_prompt_waiting = true
auto_answer_interactive = false
approve_standard_tools = true
reject_hard_approvals = false
post_restart_http_probes = [
  { name = "health", path = "/health" },
  { name = "messages", path = "/sessions/{session_id}/messages" },
]

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 480.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
