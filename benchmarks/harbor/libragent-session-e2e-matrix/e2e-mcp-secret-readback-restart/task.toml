schema_version = "1.3"
artifacts = []

[task]
name = "fritzprix/e2e-mcp-secret-readback-restart"
description = "2672 R-4: {{secret:NAME}} MCP server is stored, masked in config, and read back cleanly after an in-place instance restart"
keywords = ["libragent", "session-e2e", "mcp", "secret", "restart"]

[metadata]
difficulty = "medium"
category = "session-api-e2e"
tags = ["matrix", "R-4", "mcp", "secret", "restart"]

[metadata.libragent_session_e2e]
matrix_id = "2672-R-4"
mock_keychain_mode = "succeed"
auto_answer_interactive = true
approve_standard_tools = true
reject_hard_approvals = false
restart_after_completion = true
post_restart_http_probes = [
  { name = "health", path = "/health" },
]
post_restart_sql_probes = [
  { name = "mcp_server", query = "SELECT name, config, secret_names FROM mcp_servers WHERE name = 'e2e-r4-readback'" },
]

[verifier]
timeout_sec = 240.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
os = "linux"
