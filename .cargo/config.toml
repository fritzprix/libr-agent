# Reduce debug info in dev/test profiles to avoid MSVC link.exe LNK1102
# (out-of-memory) errors when linking large Rust binaries on Windows.
[profile.dev]
debug = 1

[profile.test]
debug = 1

[build]
# Hard cap concurrent rustc/linker processes for ANY bare `cargo …` invocation.
# Full suite safety still requires `pnpm rust:test` (sequential per-target link);
# this alone does not make `cargo test --tests` safe on 32GB machines.
jobs = 2
