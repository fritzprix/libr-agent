<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Residual Equilibrium - LibrAgent Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --anthropic-dark: #141413;
        --anthropic-light: #faf9f5;
        --anthropic-mid-gray: #b0aea5;
        --anthropic-light-gray: #e8e6dc;
        --anthropic-orange: #d97757;
        --anthropic-blue: #6a9bcc;
        --anthropic-green: #788c5d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(
          135deg,
          var(--anthropic-light) 0%,
          #f5f3ee 100%
        );
        min-height: 100vh;
        color: var(--anthropic-dark);
      }

      .container {
        display: flex;
        min-height: 100vh;
        padding: 20px;
        gap: 20px;
      }
      .sidebar {
        width: 320px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
        overflow-y: auto;
        overflow-x: hidden;
      }

      .sidebar h1 {
        font-family: 'Lora', serif;
        font-size: 24px;
        font-weight: 500;
        color: var(--anthropic-dark);
        margin-bottom: 8px;
      }
      .sidebar .subtitle {
        color: var(--anthropic-mid-gray);
        font-size: 14px;
        margin-bottom: 32px;
        line-height: 1.4;
      }
      .control-section {
        margin-bottom: 32px;
      }
      .control-section h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--anthropic-dark);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control-section h3::before {
        content: '•';
        color: var(--anthropic-orange);
        font-weight: bold;
      }
      .seed-input {
        width: 100%;
        background: var(--anthropic-light);
        padding: 12px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        margin-bottom: 12px;
        border: 1px solid var(--anthropic-light-gray);
        text-align: center;
      }
      .seed-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .control-group {
        margin-bottom: 20px;
      }
      .control-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--anthropic-dark);
        margin-bottom: 8px;
      }
      .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .slider-container input[type='range'] {
        flex: 1;
        height: 4px;
        background: var(--anthropic-light-gray);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
      }
      .slider-container input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: var(--anthropic-orange);
        border-radius: 50%;
        cursor: pointer;
      }
      .value-display {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--anthropic-mid-gray);
        min-width: 40px;
        text-align: right;
      }
      .color-group {
        margin-bottom: 16px;
      }
      .color-picker-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .color-picker-container input[type='color'] {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
      }
      .button {
        background: var(--anthropic-orange);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
      }
      .button.secondary {
        background: var(--anthropic-blue);
      }
      .button.tertiary {
        background: var(--anthropic-green);
      }
      .canvas-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #canvas-container {
        width: 100%;
        max-width: 800px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
        background: white;
      }
      #canvas-container canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--anthropic-mid-gray);
        padding: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h1>Residual Equilibrium</h1>
        <div class="subtitle">
          An algorithmic celebration of LibrAgent's immutable memory
          architecture.
        </div>

        <div class="control-section">
          <h3>Seed</h3>
          <input
            type="number"
            id="seed-input"
            class="seed-input"
            value="12345"
            onchange="updateSeed()"
          />
          <div class="seed-controls">
            <button class="button secondary" onclick="previousSeed()">
              ← Prev
            </button>
            <button class="button secondary" onclick="nextSeed()">
              Next →
            </button>
          </div>
          <button class="button tertiary" onclick="randomSeedAndUpdate()">
            ↻ Randomize Identity
          </button>
        </div>

        <div class="control-section">
          <h3>System Parameters</h3>
          <div class="control-group">
            <label>Compaction Strength</label>
            <div class="slider-container">
              <input
                type="range"
                id="compact"
                min="0.1"
                max="1.5"
                step="0.01"
                value="0.8"
                oninput="updateParam('compact', this.value)"
              />
              <span class="value-display" id="compact-value">0.8</span>
            </div>
          </div>
          <div class="control-group">
            <label>Particle Density</label>
            <div class="slider-container">
              <input
                type="range"
                id="density"
                min="200"
                max="3000"
                step="100"
                value="1200"
                oninput="updateParam('density', this.value)"
              />
              <span class="value-display" id="density-value">1200</span>
            </div>
          </div>
          <div class="control-group">
            <label>Flow Complexity</label>
            <div class="slider-container">
              <input
                type="range"
                id="noise"
                min="0.001"
                max="0.02"
                step="0.001"
                value="0.005"
                oninput="updateParam('noise', this.value)"
              />
              <span class="value-display" id="noise-value">0.005</span>
            </div>
          </div>
          <div class="control-group">
            <label>Residual Persistence</label>
            <div class="slider-container">
              <input
                type="range"
                id="persist"
                min="0.1"
                max="0.99"
                step="0.01"
                value="0.92"
                oninput="updateParam('persist', this.value)"
              />
              <span class="value-display" id="persist-value">0.92</span>
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Neural Palette</h3>
          <div class="color-group">
            <label>Core Memory</label>
            <div class="color-picker-container">
              <input
                type="color"
                id="color1"
                value="#d97757"
                onchange="updateColor('color1', this.value)"
              />
            </div>
          </div>
          <div class="color-group">
            <label>Context Flux</label>
            <div class="color-picker-container">
              <input
                type="color"
                id="color2"
                value="#3d3935"
                onchange="updateColor('color2', this.value)"
              />
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Actions</h3>
          <button
            class="button"
            onclick="saveCanvas('residual_equilibrium.png')"
          >
            Export Frame (PNG)
          </button>
          <button
            class="button secondary"
            style="margin-top: 8px"
            onclick="resetParameters()"
          >
            Reset System
          </button>
        </div>
      </div>

      <div class="canvas-area">
        <div id="canvas-container">
          <div class="loading">Calibrating neural fields...</div>
        </div>
      </div>
    </div>

    <script>
      let seed = 12345;
      let params = {
        compact: 0.8,
        density: 1200,
        noise: 0.005,
        persist: 0.92,
        colorPalette: ['#d97757', '#3d3935'],
      };

      let defaultParams = { ...params };
      let particles = [];

      function setup() {
        let canvas = createCanvas(1000, 1000);
        canvas.parent('canvas-container');
        pixelDensity(2);
        initializeSystem();
        document.querySelector('.loading').style.display = 'none';
      }

      function initializeSystem() {
        randomSeed(seed);
        noiseSeed(seed);
        particles = [];
        for (let i = 0; i < params.density; i++) {
          particles.push(new Token(random(width), random(height)));
        }
        background(252, 250, 248);
      }

      function draw() {
        background(252, 250, 248, (1 - params.persist) * 255);
        translate(width / 2, height / 2);

        for (let p of particles) {
          p.update();
          p.display();
        }
      }

      class Token {
        constructor(x, y) {
          this.pos = createVector(x - width / 2, y - height / 2);
          this.prevPos = this.pos.copy();
          this.vel = createVector(0, 0);
          this.acc = createVector(0, 0);
          this.maxSpeed = random(1, 3);
        }

        update() {
          this.prevPos = this.pos.copy();

          let n = noise(
            this.pos.x * params.noise,
            this.pos.y * params.noise,
            frameCount * 0.005,
          );
          let angle = n * TWO_PI * 4;
          let flow = p5.Vector.fromAngle(angle).mult(0.5);

          let d = this.pos.mag();
          let gravity = this.pos
            .copy()
            .mult(-1)
            .normalize()
            .mult(params.compact * (d / 500));

          this.acc.add(flow);
          this.acc.add(gravity);

          this.vel.add(this.acc);
          this.vel.limit(this.maxSpeed);
          this.pos.add(this.vel);
          this.acc.mult(0);

          if (this.pos.mag() > 1000) {
            this.pos = createVector(
              random(-width / 2, width / 2),
              random(-height / 2, height / 2),
            );
            this.prevPos = this.pos.copy();
          }
        }

        display() {
          let d = this.pos.mag();
          let alpha = map(d, 0, 500, 200, 20);
          let weight = map(d, 0, 500, 3, 0.5);

          let c =
            d < 100
              ? color(params.colorPalette[1])
              : color(params.colorPalette[0]);
          c.setAlpha(alpha);
          stroke(c);

          strokeWeight(weight);
          line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
        }
      }

      function updateParam(id, val) {
        params[id] = parseFloat(val);
        document.getElementById(id + '-value').innerText = val;
        if (id === 'density') initializeSystem();
      }

      function updateColor(id, val) {
        if (id === 'color1') params.colorPalette[0] = val;
        if (id === 'color2') params.colorPalette[1] = val;
      }

      function updateSeed() {
        seed = parseInt(document.getElementById('seed-input').value);
        initializeSystem();
      }

      function previousSeed() {
        seed--;
        document.getElementById('seed-input').value = seed;
        initializeSystem();
      }

      function nextSeed() {
        seed++;
        document.getElementById('seed-input').value = seed;
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        seed = Math.floor(Math.random() * 99999);
        document.getElementById('seed-input').value = seed;
        initializeSystem();
      }

      function resetParameters() {
        params = { ...defaultParams };
        params.colorPalette = ['#d97757', '#3d3935'];
        initializeSystem();
        // Reset UI Sliders
        ['compact', 'density', 'noise', 'persist'].forEach((id) => {
          document.getElementById(id).value = params[id];
          document.getElementById(id + '-value').innerText = params[id];
        });
      }
    </script>
  </body>
</html>
